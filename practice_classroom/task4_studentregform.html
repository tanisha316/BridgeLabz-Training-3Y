<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>

    <h1 align="center">Student Registration Form</h1>

    <table border="1" cellspacing="0" cellpadding="10" align="center" width="80%">

        <tr>
            <th colspan="2">
                <h2>Registration Form</h2>
            </th>
        </tr>

        <tr>
            <td>Full Name</td>
            <td>
                <input type="text" placeholder="Enter your name" size="35">
            </td>
        </tr>

        <tr>
            <td>Email</td>
            <td>
                <input type="email" placeholder="abc@gmail.com" size="35">
            </td>
        </tr>

        <tr>
            <td>Phone Number</td>
            <td>
                <input type="tel" placeholder="9876543210" size="35">
            </td>
        </tr>

        <tr>
            <td>Date of Birth</td>
            <td>
                <input type="date">
            </td>
        </tr>

        <tr>
            <td>Gender</td>
            <td>
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
                <input type="radio" name="gender"> Other
            </td>
        </tr>

        <tr>
            <td>Skills</td>
            <td>
                <input type="checkbox"> HTML
                <input type="checkbox"> CSS
                <input type="checkbox"> JavaScript
            </td>
        </tr>

        <tr>
            <td>Course</td>
            <td>
                <select>
                    <option>--Select Course--</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>B.Sc</option>
                    <option>MCA</option>
                    <option>M.Tech</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Address</td>
            <td>
                <textarea rows="5" cols="45"></textarea>
            </td>
        </tr>

        <tr>
            <td>Upload Resume</td>
            <td>
                <input type="file">
            </td>
        </tr>

        <tr>
            <td colspan="2" align="center">
                <input type="submit" value="Register">
                <input type="reset" value="Reset">
            </td>
        </tr>

    </table>

</body>
</html>
